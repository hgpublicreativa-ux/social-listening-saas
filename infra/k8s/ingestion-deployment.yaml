apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: social-listening
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
        - name: ingestion
          image: social-listening/ingestion:latest
          envFrom:
            - secretRef:
                name: social-listening-secrets
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          restartPolicy: Always
