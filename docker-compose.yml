version: "3.9"

services:
  # ── Infrastructure ──────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: ["2181:2181"]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  postgres:
    image: timescale/timescaledb:latest-pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: socialdb
      POSTGRES_USER: social
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-social_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    ports: ["9200:9200"]
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # ── Application Services ────────────────────────────────────────────────
  api:
    build: ./services/api
    ports: ["8000:8000"]
    depends_on: [postgres, redis, elasticsearch]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://social:${POSTGRES_PASSWORD:-social_secret}@postgres:5432/socialdb
      REDIS_URL: redis://redis:6379
      ES_URL: http://elasticsearch:9200
    volumes:
      - ./services/api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  ingestion:
    build: ./services/ingestion
    depends_on: [kafka, redis]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379
    restart: unless-stopped

  nlp_worker:
    build: ./services/nlp_worker
    depends_on: [kafka, redis, postgres]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+asyncpg://social:${POSTGRES_PASSWORD:-social_secret}@postgres:5432/socialdb
      ES_URL: http://elasticsearch:9200
    deploy:
      replicas: 2

  metrics_worker:
    build: ./services/metrics_worker
    depends_on: [kafka, postgres]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DATABASE_URL: postgresql+asyncpg://social:${POSTGRES_PASSWORD:-social_secret}@postgres:5432/socialdb

  alert_engine:
    build: ./services/alert_engine
    depends_on: [kafka, redis, postgres]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+asyncpg://social:${POSTGRES_PASSWORD:-social_secret}@postgres:5432/socialdb

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api]

volumes:
  postgres_data:
  es_data:
